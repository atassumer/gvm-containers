apiVersion: v1
kind: Service
metadata:
  name: {{ include "gvm.fullname" . }}-gvmd-db
  labels:
  {{- $_ := set . "applicationNameSuffix" "gvmd" }}
  {{- include "gvm.labels" . | nindent 4 }}
  {{- $_ := set . "applicationNameSuffix" "" }}
spec:
  ports:
    - port: 5432
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gvmd-db
spec:
  serviceName: "postgres"
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "gvm.name" . }}-gvmd-db
      app.kubernetes.io/instance: {{ include "gvm.instance" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "gvm.name" . }}-gvmd-db
        app.kubernetes.io/instance: {{ include "gvm.instance" . }}
    spec:
      containers:
      - name: {{ .Chart.Name }}
        image: postgres:15-alpine # Hafif ve sade resmi imaj
        env:
        - name: POSTGRES_DB
          value: {{ .Values.gvmd-db.postgresqlPassword }}
        - name: POSTGRES_USER
          value: {{ .Values.gvmd-db.postgresqlUsername }}  
        - name: POSTGRES_PASSWORD
          value: {{ .Values.gvmd-db.postgresqlPassword }}
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
          subPath: postgres 
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: {{ .Values.gvmd-db.storageClass }}
      resources:
        requests:
          storage: {{ .Values.gvmd-db.size }}

---


apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: "postgres"
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine # Bitnami değil, resmi Docker Hub imajı
        env:
        - name: POSTGRES_PASSWORD
          value: {{ .Values.gvmd-db.postgresqlPassword }}
        - name: POSTGRES_USER
          value: {{ .Values.gvmd-db.postgresqlUsername }}          
        - name: POSTGRES_DB
          value: {{ .Values.gvmd-db.postgresqlDatabase }}               
        ports:
        - containerPort: 5432
