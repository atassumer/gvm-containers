apiVersion: v1
kind: Service
metadata:
  name: {{ include "gvm.fullname" . }}-gvmd-db
  labels:
  {{- $_ := set . "applicationNameSuffix" "gvmd" }}
  {{- include "gvm.labels" . | nindent 4 }}
  {{- $_ := set . "applicationNameSuffix" "" }}
spec:
  ports:
    - port: 5432
  selector:
    app.kubernetes.io/name: {{ include "gvm.name" . }}-gvmd-db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "gvm.fullname" . }}-gvmd-db
spec:
  serviceName: "postgres"
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "gvm.name" . }}-gvmd-db
      app.kubernetes.io/instance: {{ include "gvm.instance" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "gvm.name" . }}-gvmd-db
        app.kubernetes.io/instance: {{ include "gvm.instance" . }}
    spec:
      containers:
      - name: {{ .Chart.Name }}
        image: greenbone/gvmd-pg-ext:15
        env:
        - name: POSTGRES_DB
          value: {{ (index .Values "gvmd-db").postgresqlDatabase }}
        - name: POSTGRES_USER
          value: {{ (index .Values "gvmd-db").postgresqlUsername }}
        - name: POSTGRES_PASSWORD
          value: {{ (index .Values "gvmd-db").postgresqlPassword }}
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
          subPath: postgres 
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: {{ (index .Values "gvmd-db").persistence.storageClass }}
      resources:
        requests:
          storage: {{ (index .Values "gvmd-db").persistence.size }}
